<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<title>スラッシュリーディング練習</title>
<style>
button,input,select{font-family:inherit}
:root{
  --bg:#000; --card:#0d0d0f; --ink:#fff; --sub:#9ca3af;
  --blue:#7dd3fc; --blue-d:#38bdf8; --blue-l:#0f2a38; --blue-m:#1e5a78;
  --ok:#4ade80; --ng:#ff4d4d; --kana-size:7px; --line:#27272a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Klee One","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sndg{display:flex;gap:6px}
.snd{border:1px solid var(--blue-m);background:var(--blue-l);color:var(--sub);border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
.snd.on{color:var(--blue);border-color:var(--blue)}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--blue-m);background:var(--blue-l);color:var(--blue);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue-d);border-color:var(--blue-d);color:#032a3d}
.btn{border:0;background:var(--blue-d);color:#032a3d;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--blue-l);color:var(--blue);border:2px solid var(--blue-m)}
.btn:disabled{opacity:.4}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:140px}
.row3{flex-wrap:nowrap}.row3>.btn{min-width:0;padding:12px 6px;font-size:15px;line-height:1.3}.row3 small{font-weight:400;font-size:11px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gcard{position:relative;padding-top:34px}
.clr{position:absolute;top:8px;right:10px;border:1px solid var(--blue-m);background:var(--blue-l);color:var(--blue);border-radius:999px;padding:3px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.lvgrid{display:grid;grid-template-columns:62px repeat(5,1fr);gap:5px;align-items:stretch}
.gh{border:0;background:transparent;color:var(--blue);font-family:inherit;font-size:16px;font-weight:600;line-height:1.1;padding:2px 0;cursor:pointer}
.gh small{display:block;font-size:9px;color:var(--sub);font-weight:400;margin-top:2px}
.rh{text-align:left}
.gc{height:38px;border:2px solid var(--blue-m);background:var(--blue-l);color:var(--blue);border-radius:9px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0}
.gc.on{background:var(--blue-d);border-color:var(--blue-d);color:#032a3d}
.gc.empty{border-style:dashed;border-color:#1b3a4d;background:transparent;color:#3b5668;cursor:default}
.count{font-size:13px;color:var(--sub);margin-top:8px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.badge{display:inline-block;background:var(--blue-d);color:#032a3d;border-radius:8px;padding:2px 10px;font-weight:800;font-size:15px;letter-spacing:.5px}

/* practice */
.sentence{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:18px;padding:12px 0 6px}
html,body{overscroll-behavior:none}
#pcard,#pcard *{-webkit-touch-callout:none}
.cell{display:flex;flex-direction:column;align-items:flex-start;margin:0 2px}
.wk{display:flex;flex-direction:column;align-items:center}
.kana{height:12px;font-size:var(--kana-size);color:var(--blue);font-weight:600;visibility:hidden;white-space:nowrap}
.cell.done .kana{visibility:visible}
.word{touch-action:none;user-select:none;-webkit-user-select:none;border:0;background:transparent;color:#fff;font-size:30px;line-height:36px;height:48px;font-weight:600;padding:6px 8px;cursor:grab;transition:transform .15s,color .15s}
.word.drag{transition:none}
.word.hintok,.cell.ok .word.hintok{color:var(--ok)} .word.hintng,.cell.ng .word.hintng{color:var(--ng)}
.cell.ok .word{color:var(--ok)} .cell.ng .word{color:var(--ng)}
.ja{height:26px;font-size:17px;line-height:22px;color:#fff;visibility:hidden;margin-top:2px;padding-left:8px;text-align:left;white-space:nowrap}
.cell.done .ja{visibility:visible}
.slash{display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(.3) rotate(-20deg);margin:0 2px;width:16px}
.slash i{display:block;height:12px}
.slash b{display:block;height:48px;line-height:46px;font-size:34px;font-weight:300;color:var(--blue)}
.slash.show{opacity:1;transform:scale(1) rotate(0);transition:all .35s cubic-bezier(.3,1.8,.5,1)}
.hint{font-size:12px;color:var(--sub);margin-top:10px}
#pcard{position:relative;overflow:hidden}
#pcard::before,#pcard::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}
#pcard.lit::before{background:radial-gradient(ellipse 80% 90% at 50% -10%,rgba(255,240,170,.75),rgba(255,230,140,.25) 45%,transparent 75%);animation:lightOn 2.4s ease-out forwards}
#pcard.lit::after{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);animation:sweep 1.6s ease-out .1s forwards}
#pcard.lit{animation:cardGlow 2.4s ease-out forwards}
#pcard.lit .word{animation:wordGlow 2.4s ease-out forwards}
@keyframes lightOn{0%{opacity:0}25%{opacity:1}100%{opacity:.35}}
@keyframes sweep{0%{opacity:1;transform:translateX(-100%)}100%{opacity:0;transform:translateX(100%)}}
@keyframes cardGlow{0%{box-shadow:0 0 0 rgba(255,230,140,0)}30%{box-shadow:0 0 36px rgba(255,230,140,.55)}100%{box-shadow:0 0 18px rgba(255,230,140,.25)}}
@keyframes wordGlow{0%{text-shadow:0 0 0 rgba(255,245,190,0)}30%{text-shadow:0 0 16px rgba(255,245,190,.95)}100%{text-shadow:0 0 8px rgba(255,245,190,.45)}}
.finish{margin-top:16px}
.finrow{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#trtext{margin-bottom:8px}
.tja .tng{color:var(--ng);font-weight:700}
.tja{font-size:18px;color:#fff}
.sum{font-size:15px;margin-bottom:10px}

/* stock */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.lvl{font-size:15px;font-weight:800;color:var(--blue);margin:14px 0 6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.rank{width:26px;text-align:center;font-weight:800;color:var(--blue-m)}
.item .main{flex:1;min-width:0}
.item .en{font-size:17px;font-weight:700;cursor:pointer}
.item .meta{font-size:12px;color:var(--sub)}
.miss{background:#3b1220;color:var(--ng);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.del{border:0;background:var(--blue-l);color:var(--blue);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:14px}
.hidden{display:none}
</style>

const LV = {A:1,B:2,C:3,D:4,E:5};
const CIRC=["①","②","③","④","⑤"];
const LVNAME={A:"中1全体",B:"中2初級",C:"中2全体",D:"中3初級",E:"高校入試"};
const bandOf=n=>Math.min(5,Math.max(1,Math.floor((n-3)/3)+1));
const SENTS = RAW.map(([raw,segstr],idx)=>{
  const segs=segstr.split(";").map(x=>{const [t,u]=x.split(":");return {t,u:u.split(",").map(Number)};});
  const full=segs.map(g=>g.t).join("");
  const tokens=[];
  raw.split(/\s+/).forEach(t=>{
    if(t==="/"){tokens.push({slash:true});return;}
    const m=t.match(/^([^{]+)(?:\{([^}]*)\})?$/);
    const idiom=m[1].includes("_");
    const w=m[1].replace(/_/g," "), key=w.replace(/[.,!?]/g,"").toLowerCase();
    if(!D[key]) console.warn("辞書にない語:",key);
    tokens.push({w,key,idiom,explicit:idiom||m[2]!==undefined,ja:m[2]!==undefined?m[2]:(D[key]||["","","?"])[2]});
  });
  tokens.splice(0,tokens.length,...mergeIdioms(tokens));
  const words=tokens.filter(t=>!t.slash);
  let lv="A"; words.forEach(t=>{const l=(D[t.key]||["A"])[0]; if(LV[l]>LV[lv]) lv=l;});
  const wc=words.reduce((n,t)=>n+t.w.split(" ").length,0);
  const en=tokens.map(t=>t.slash?"/":t.w).join(" ");
  const band=bandOf(wc);
  return {id:idx,raw:en,en,full,segs,tokens,n:words.length,wc,lv,band,key:band+lv,label:lv+band};
});

// 単語ストックの表示用：文中で大文字で書かれる語（I, 固有名詞）は大文字で出す
const CAP=new Set(["i"]);
SENTS.forEach(s=>{let first=true;s.tokens.forEach(t=>{if(t.slash){first=false;return;} /* 文頭以外で大文字なら固有の大文字 */ if(!first&&!t.idiom&&/^[A-Z]/.test(t.w)) CAP.add(t.key); first=false;});});
const disp=k=>CAP.has(k)?k.charAt(0).toUpperCase()+k.slice(1):k;

// iPhone対策：最初のタッチで読み上げを「解錠」し、cancel直後のspeakを避ける
let _unl=false;
function unlockSpeech(){
  if(_unl) return;
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); _unl=true; }catch(e){}
}
function say(text,lang,rate,voice){
  try{
    const go=()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang; u.rate=rate; u.pitch=1; u.volume=1;
      if(voice) u.voice=voice;
      try{speechSynthesis.resume();}catch(_){}
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(go,60); }
    else go();
  }catch(e){}
}

const VOICE_PREF={
  ja:[/natural|online/i,/nanami|keita/i,/siri/i,/premium|enhanced|拡張|プレミアム/i,/o-?ren|kyoko|hattori|otoya/i,/google/i,/haruka|ayumi|sayaka|ichiro/i],
  en:[/natural|online/i,/aria|jenny|guy/i,/siri/i,/premium|enhanced/i,/samantha|ava|allison|zoe/i,/google/i]
};
let _vc={};
function pickVoice(lang){
  try{
    if(_vc[lang]) return _vc[lang];
    const vs=speechSynthesis.getVoices().filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(lang==="ja"?"ja":"en-us"));
    if(!vs.length) return null;
    let best=null;
    for(const re of VOICE_PREF[lang]){ best=vs.find(v=>re.test(v.name)); if(best) break; }
    best=best||vs.find(v=>!/compact/i.test(v.name))||vs[0];
    _vc[lang]=best; return best;
  }catch(e){return null;}
}
try{ speechSynthesis.onvoiceschanged=()=>{_vc={};}; speechSynthesis.getVoices(); }catch(e){}
function speakJa(text){
  if(!sel.voice||!text) return;
  say(text,"ja-JP",1,pickVoice("ja"));
}
// ○でも●でも、日本語の訳だけを1回読む
function speakUnit(t,v){
  const kana=(D[t.key]||[])[1]||"";
  const ja=yomi(t.ja);
  speakJa(ja||kana);
}
/* ===== きらきら演出 ===== */
let AC=null;
function audio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){} return AC; }
function chime(){
  if(!sel.sound) return;
  const ac=audio(); if(!ac) return;
  try{
    const t0=ac.currentTime+0.02;
    // キラ・リン：短い2音のあと、高い音を長めに響かせる
    [[1976,0,.18,.09],[2637,.075,.18,.09],[3951,.15,.7,.11]].forEach(([f,dt,len,v])=>{
      const t=t0+dt;
      [[f,v],[f*2.01,v*.3]].forEach(([fr,vv])=>{
        const o=ac.createOscillator(), g=ac.createGain();
        o.type="sine"; o.frequency.value=fr;
        g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vv,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
        o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+len+0.05);
      });
    });
  }catch(e){}
}

/* ===== コンボ音：下フリック（わかる）が続くたびに ドレミファソラシド と上がる ===== */
let comboN=0;
const SCALE=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5];
function pip(freq,vol){
  if(!sel.sound) return;
  const ac=audio(); if(!ac) return;
  try{
    const t=ac.currentTime+0.01;
    [[freq,vol,"sine"],[freq*2,vol*.35,"triangle"]].forEach(([f,v,ty])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=ty; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.24);
    });
  }catch(e){}
}
function combo(v){
  if(v==="ok"){ pip(SCALE[Math.min(comboN,SCALE.length-1)],0.16); comboN++; }
  else comboN=0;
}
function celebrate(card){ chime(); }

/* ===== 状態 ===== */
const app=document.getElementById("app");
let sel={cells:new Set(),sound:true,voice:true};
let queue=[],qi=0,ans={},finished=false;
let stockTab="words";

const $=(h)=>{const d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild;};
const SET=5;
const pool=()=>SENTS.filter(s=>sel.cells.has(s.key));
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===== トップ ===== */
function home(){
  const nWords=Object.keys(mem.words).length, nSents=Object.keys(mem.sents).length;
  app.innerHTML=`
    <div class="hd"><h1>スラッシュリーディング練習</h1><div class="sndg"><button class="snd ${sel.sound?"on":""}" id="snd">効果音 ${sel.sound?"ON":"OFF"}</button></div></div>
    <div class="card gcard">
      <button class="clr" id="clr">クリア</button>
      <div class="lvgrid" id="grid">
        <div></div>
        ${[1,2,3,4,5].map(b=>`<button class="gh" data-col="${b}">${CIRC[b-1]}<small>${3*b}〜${3*b+2}語</small></button>`).join("")}
        ${["A","B","C","D","E"].map(l=>`<button class="gh rh" data-row="${l}">${l}<small>${LVNAME[l]}</small></button>`+[1,2,3,4,5].map(b=>{
          const k=b+l, n=SENTS.filter(x=>x.key===k).length;
          return `<button class="gc ${n?(sel.cells.has(k)?"on":""):"empty"}" data-k="${k}" ${n?"":"disabled"}>${l}${b}</button>`;}).join("")).join("")}
      </div>
    </div>
    <div class="row row3">
      <button class="btn" id="start">スタート</button>
      <button class="btn sec" id="stockBtn">単語ストック</button>
      <button class="btn sec" id="stockSent">英文ストック</button>
    </div>`;
  const cellKeys=()=>[...app.querySelectorAll(".gc:not(.empty)")].map(e=>e.dataset.k);
  app.querySelectorAll(".gc:not(.empty)").forEach(b=>b.onclick=()=>{const k=b.dataset.k; sel.cells.has(k)?sel.cells.delete(k):sel.cells.add(k); home();});
  const toggleGroup=ks=>{ if(!ks.length) return; const all=ks.every(k=>sel.cells.has(k)); ks.forEach(k=>all?sel.cells.delete(k):sel.cells.add(k)); home(); };
  app.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>toggleGroup(cellKeys().filter(k=>k[0]===b.dataset.col)));
  app.querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>toggleGroup(cellKeys().filter(k=>k[1]===b.dataset.row)));
  document.getElementById("clr").onclick=()=>{sel.cells.clear();home();};
  document.getElementById("snd").onclick=()=>{sel.sound=!sel.sound;home();};
  document.getElementById("start").onclick=()=>{
    const p=pool(); if(!p.length){const g=document.getElementById("grid");g.classList.remove("shake");void g.offsetWidth;g.classList.add("shake");return;}
    startQueue(shuffle(p).slice(0,SET));
  };
  document.getElementById("stockBtn").onclick=stock;
  document.getElementById("stockSent").onclick=()=>{stockTab="sents";stock();};
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQueue(q){queue=q;qi=0;comboN=0;practice();}

/* ===== 練習 ===== */
function practice(){ comboN=0;
  const s=queue[qi]; ans={}; finished=false;
  app.innerHTML=`
    <div class="top">
      <button class="btn small sec" id="back">← トップ</button>
      <div><span class="badge">${s.label}</span> <span class="sub">${qi+1} / ${queue.length}</span></div>
    </div>
    <div class="card" id="pcard">
      <div class="sentence" id="sent"></div>
    </div>
    <div class="finish hidden" id="fin"></div>`;
  document.getElementById("back").onclick=home;
  const box=document.getElementById("sent");
  let wi=0;
  s.tokens.forEach((t,ti)=>{
    if(t.slash){ const sp=document.createElement("span"); sp.className="slash"; sp.id="sl"+ti; sp.innerHTML="<i></i><b>/</b>"; box.appendChild(sp); return; }
    const i=wi++; const d=D[t.key]||["A","?","?"];
    const c=$(`<div class="cell" id="c${i}">
      <div class="wk"><div class="kana">${d[1]}</div>
      <button class="word${t.idiom?" idiom":""}">${esc(t.w)}</button></div>
      <div class="ja">${esc(t.ja)}</div></div>`);
    attachSwipe(c.querySelector(".word"),i,t.w);
    box.appendChild(c);
  });
}
function attachSwipe(w,i,text){
  let sx=0,sy=0,on=false;
  w.addEventListener("pointerdown",e=>{audio();unlockSpeech();sx=e.clientX;sy=e.clientY;on=true;w.classList.add("drag");try{w.setPointerCapture(e.pointerId);}catch(_){}});
  w.addEventListener("pointermove",e=>{
    if(!on) return;
    const dy=e.clientY-sy, dx=e.clientX-sx;
    w.style.transform=`translateY(${Math.max(-26,Math.min(26,dy))}px)`;
    const sw=Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx);
    w.classList.toggle("hintok",sw&&dy>0); w.classList.toggle("hintng",sw&&dy<0);
  });
  const end=e=>{
    if(!on) return; on=false;
    const dy=e.clientY-sy, dx=e.clientX-sx;
    w.classList.remove("drag","hintok","hintng"); w.style.transform="";
    if(e.type==="pointercancel") return;
    if(Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx)) answer(i,dy>0?"ok":"ng");
    else if(Math.abs(dy)<10&&Math.abs(dx)<10) speak(text);
  };
  w.addEventListener("pointerup",end); w.addEventListener("pointercancel",end);
}
function answer(i,v){
  ans[i]=v;
  combo(v);
  const c=document.getElementById("c"+i);
  c.classList.remove("ok","ng"); c.classList.add("done",v);
  refreshSlashes();
}
function refreshSlashes(){
  const s=queue[qi]; let wi=0,start=0;
  const chunks=[];
  s.tokens.forEach((t,ti)=>{
    if(t.slash){ chunks.push({end:wi,from:start,slashId:"sl"+ti}); start=wi; }
    else wi++;
  });
  chunks.forEach(ch=>{
    let all=true; for(let k=ch.from;k<ch.end;k++) if(!ans[k]) all=false;
    const el=document.getElementById(ch.slashId);
    if(all && !el.classList.contains("show")){ el.classList.add("show"); }
    if(!all) el.classList.remove("show");
  });
  const n=s.n; let done=0; for(let k=0;k<n;k++) if(ans[k]) done++;
  const fin=document.getElementById("fin");
  if(done===n){
    const ng=Object.values(ans).filter(v=>v==="ng").length;
    fin.classList.remove("hidden");
    const pc=document.getElementById("pcard");
    if(ng===0){ if(!pc.classList.contains("lit")){ pc.classList.add("lit"); celebrate(pc); } } else pc.classList.remove("lit");
    const wasOpen=!!document.getElementById("trtext") && !document.getElementById("trtext").classList.contains("hidden");
    fin.innerHTML=`<div class="sum">${ng===0?"":`わからなかった単語：${ng}語（ストックに入ります）`}</div>
      <div class="card ${wasOpen?"":"hidden"}" id="trtext"></div>
      <div class="finrow"><button class="btn small sec" id="tr">全訳</button>
      <button class="btn small" id="next">${qi+1<queue.length?"次の文へ":"おわり"}</button></div>`;
    document.getElementById("trtext").innerHTML=`<div class="tja">${s.segs.map(g=>`<span class="${g.u.some(k=>ans[k]==="ng")?"tng":""}">${esc(g.t)}</span>`).join("")}</div>`;
    document.getElementById("tr").onclick=()=>{document.getElementById("trtext").classList.toggle("hidden");};
    document.getElementById("next").onclick=commit;
  } else { fin.classList.add("hidden"); const pc=document.getElementById("pcard"); if(pc) pc.classList.remove("lit"); }
}
function commit(){
  const s=queue[qi]; let wi=0, anyNg=false;
  s.tokens.forEach(t=>{
    if(t.slash) return;
    const v=ans[wi++];
    if(v==="ng"){
      anyNg=true;
      const w=mem.words[t.key]||(mem.words[t.key]={miss:0});
      w.miss++;
    }
  });
  if(anyNg){ const e=mem.sents[s.id]||(mem.sents[s.id]={miss:0}); e.miss++; }
  save();
  if(qi+1<queue.length){qi++;practice();} else home();
}

/* ===== ストック ===== */
function stock(){
  const wk=Object.keys(mem.words), sk=Object.keys(mem.sents);
  let body="";
  if(stockTab==="words"){
    if(!wk.length) body=`<div class="empty">まだありません</div>`;
    else ["A","B","C","D","E"].forEach(l=>{
      const list=wk.filter(k=>(D[k]||["A"])[0]===l)
        .sort((a,b)=>mem.words[b].miss-mem.words[a].miss || a.localeCompare(b));
      if(!list.length) return;
      body+=`<div class="lvl">レベル ${l}（${list.length}語）</div>`+list.map((k,r)=>`
        <div class="item"><div class="rank">${r+1}</div>
          <div class="main"><div class="en" data-w="${k}">${disp(k)}</div><div class="meta">${D[k][1]}　${D[k][2]}</div></div>
          <span class="miss">${mem.words[k].miss}回</span>
          <button class="del" data-d="${k}">覚えた</button></div>`).join("");
    });
  } else {
    if(!sk.length) body=`<div class="empty">まだありません</div>`;
    else body=`<button class="btn small" id="pracStock" style="margin-bottom:6px">この${Math.min(SET,sk.length)}文を練習する</button>`+sk.map(Number).sort((a,b)=>mem.sents[b].miss-mem.sents[a].miss).map(id=>{
      const s=SENTS[id]; return `<div class="item"><span class="badge">${s.label}</span>
        <div class="main"><div class="en" data-s="${s.raw.replace(/"/g,"")}">${esc(s.raw)}</div></div>
        <span class="miss">${mem.sents[id].miss}回</span>
        <button class="del" data-ds="${id}">覚えた</button></div>`;}).join("");
  }
  app.innerHTML=`
    <div class="top"><button class="btn small sec" id="back">← トップ</button><h1 style="margin:0">ストック</h1><span></span></div>
    <div class="tabs">
      <button class="chip ${stockTab==="words"?"on":""}" data-t="words">単語（${wk.length}）</button>
      <button class="chip ${stockTab==="sents"?"on":""}" data-t="sents">文（${sk.length}）</button>
    </div>
    <div class="card">${body}</div>`;
  document.getElementById("back").onclick=home;
  const pr=document.getElementById("pracStock"); if(pr) pr.onclick=()=>{const ids=sk.map(Number); startQueue(shuffle(SENTS.filter(s=>ids.includes(s.id))).slice(0,SET));};
  app.querySelectorAll(".tabs .chip").forEach(b=>b.onclick=()=>{stockTab=b.dataset.t;stock();});
  app.querySelectorAll("[data-w]").forEach(e=>e.onclick=()=>speak(e.dataset.w));
  app.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>speak(e.dataset.s));
  app.querySelectorAll("[data-d]").forEach(e=>e.onclick=()=>{delete mem.words[e.dataset.d];save();stock();});
  app.querySelectorAll("[data-ds]").forEach(e=>e.onclick=()=>{delete mem.sents[e.dataset.ds];save();stock();});
}

home();

// 練習中、文字以外をフリックしても画面全体がずれないようにする（はみ出して動かせるときは通常どおり）
document.addEventListener("touchmove",e=>{
  if(!document.getElementById("pcard")) return;
  const de=document.documentElement;
  if(de.scrollHeight<=window.innerHeight+2) e.preventDefault();
},{passive:false});
document.addEventListener("pointerdown",()=>{audio();unlockSpeech();},{passive:true});
</script>
