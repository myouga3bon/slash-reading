  --bg:#000; --card:#0d0d0f; --ink:#fff; --sub:#9ca3af;
  --blue:#7dd3fc; --blue-d:#38bdf8; --blue-l:#0f2a38; --blue-m:#1e5a78;
  --ok:#4ade80; --ng:#ff4d4d; --kana-size:10px; --line:#27272a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Klee One","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:clamp(13px,4.2vw,17px);margin:6px 0 2px;min-width:0}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sndg{display:flex;gap:6px}
.snd{border:1px solid var(--blue-m);background:var(--blue-l);color:var(--sub);border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;white-space:nowrap}
.snd.on{color:var(--blue);border-color:var(--blue)}
.sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;color:var(--sub);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--blue-m);background:var(--blue-l);color:var(--blue);border-radius:999px;padding:8px 16px;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue-d);border-color:var(--blue-d);color:#032a3d}
.btn{border:0;background:var(--blue-d);color:#032a3d;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer;width:100%}
.btn.sec{background:var(--blue-l);color:var(--blue);border:2px solid var(--blue-m)}
.btn:disabled{opacity:.4}
.btn.small{width:auto;padding:8px 14px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:140px}
.row3{flex-wrap:nowrap}.row3>.btn{min-width:0;padding:12px 6px;font-size:15px;line-height:1.3}.row3 small{font-weight:400;font-size:11px}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gcard{position:relative;padding-top:34px}
.clr{position:absolute;top:8px;right:10px;border:1px solid var(--blue-m);background:var(--blue-l);color:var(--blue);border-radius:999px;padding:3px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.lvgrid{display:grid;grid-template-columns:62px repeat(5,1fr);gap:5px;align-items:stretch}
.gh{border:0;background:transparent;color:var(--blue);font-family:inherit;font-size:16px;font-weight:600;line-height:1.1;padding:2px 0;cursor:pointer}
.gh small{display:block;font-size:9px;color:var(--sub);font-weight:400;margin-top:2px}
.rh{text-align:left}
.gc{height:38px;border:2px solid hsl(var(--h,199) 60% 29%);background:hsl(var(--h,199) 57% 14%);color:hsl(var(--h,199) 95% 74%);border-radius:9px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0}
.gc.on{background:hsl(var(--h,199) 93% 60%);border-color:hsl(var(--h,199) 93% 60%);color:#032a3d}
.gc{position:relative}
.gstar{position:absolute;top:1px;right:4px;font-size:10px;line-height:1;color:#facc15;text-shadow:0 0 2px #000,0 0 2px #000}
.pnote{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.5}
.gc{height:52px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;padding:0}
.gc.on{background:rgba(125,211,252,.18);box-shadow:inset 0 0 0 2px #e0f2fe}
.gc .cbox{display:flex;align-items:center;justify-content:center;border-radius:5px;font-size:9px;font-weight:700;color:#3b0a24;letter-spacing:.2px;transition:all .3s}
.gc.done .cbox{color:#3b0a24}
.gc.nodata{cursor:default}
.gc{position:relative}
.gc .seed{display:block;transform:rotate(-28deg);transition:all .3s}
.gc .clrtxt{position:absolute;right:2px;bottom:1px;font-size:9px;font-weight:800;color:#ffb3ba;pointer-events:none}
.hd .hr{align-self:stretch!important;align-items:stretch!important}
.hd .hr .sndg{align-self:flex-end!important}
.nsel{width:100%;justify-content:flex-start!important}
.gcard{padding-top:12px;background:#000!important}
.nsp{flex:1}
.stk{border:1px solid #86d39b;background:#dcfce7;color:#166534;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.ttlrow{display:flex;align-items:center;gap:8px}
.applogo{width:58px;height:58px;border-radius:12px;flex:0 0 auto}
.gc.empty{border-style:dashed;border-color:#1b3a4d;background:transparent;color:#3b5668;cursor:default}
.count{font-size:13px;color:var(--sub);margin-top:8px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.badge{display:inline-block;background:var(--blue-d);color:#032a3d;border-radius:8px;padding:2px 10px;font-weight:800;font-size:15px;letter-spacing:.5px}

/* practice */
.sentence{display:flex;flex-wrap:wrap;align-items:flex-start;row-gap:2px;column-gap:calc(var(--wfs,26px)*.55);padding:10px 0 4px}
html,body{overscroll-behavior:none}
#pcard,#pcard *{-webkit-touch-callout:none;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
.cell{display:flex;flex-direction:column;align-items:flex-start;margin:0}
.wk{display:flex;flex-direction:column;align-items:center}
.kana{height:14px;line-height:14px;font-size:var(--kana-size);color:var(--blue);font-weight:600;visibility:hidden;white-space:nowrap}
.cell.done .kana{visibility:visible}
.word{touch-action:none;user-select:none;-webkit-user-select:none;border:0;background:transparent;color:#fff;font-size:var(--wfs,26px);line-height:calc(var(--wfs,26px)*1.2);height:calc(var(--wfs,26px)*1.3);font-weight:600;padding:2px 0;cursor:grab;transition:transform .15s,color .15s}
.word.drag{transition:none}
.word.hintok,.cell.ok .word.hintok{color:var(--ok)} .word.hintng,.cell.ng .word.hintng{color:var(--ng)}
.word.short{position:relative;min-width:30px}
.word.short::before{content:"";position:absolute;top:-14px;bottom:-14px;left:-18px;right:-18px}
.cell.ok .word{color:var(--ok)} .cell.ng .word{color:var(--ng)}
.ja{height:calc(var(--wfs,26px)*.87);font-size:calc(var(--wfs,26px)*.57);line-height:calc(var(--wfs,26px)*.73);color:#fff;visibility:hidden;margin-top:0;padding-left:0;text-align:left;white-space:nowrap}
.cell.done .ja{visibility:visible}
.slash{display:flex;flex-direction:column;align-items:center;opacity:0;transform:scale(.3) rotate(-20deg);margin:0;width:12px}
.slash.dbl{width:24px;letter-spacing:-1.5px}
.slash i{display:block;height:14px}
.slash b{display:block;height:calc(var(--wfs,26px)*1.3);line-height:calc(var(--wfs,26px)*1.25);font-size:calc(var(--wfs,26px)*1.13);font-weight:400;color:#ff8fc7}
.slash.show{opacity:1;transform:scale(1) rotate(0);transition:all .35s cubic-bezier(.3,1.8,.5,1)}
.hint{font-size:12px;color:var(--sub);margin-top:10px}
#pcard{position:relative;overflow:hidden}
#pcard::before,#pcard::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}
#pcard.lit::before{background:radial-gradient(ellipse 80% 90% at 50% -10%,rgba(255,240,170,.75),rgba(255,230,140,.25) 45%,transparent 75%);animation:lightOn 2.4s ease-out forwards}
#pcard.lit::after{background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);animation:sweep 1.6s ease-out .1s forwards}
#pcard.lit{animation:cardGlow 2.4s ease-out forwards}
#pcard.lit .word{animation:wordGlow 2.4s ease-out forwards}
@keyframes lightOn{0%{opacity:0}25%{opacity:1}100%{opacity:.35}}
@keyframes sweep{0%{opacity:1;transform:translateX(-100%)}100%{opacity:0;transform:translateX(100%)}}
@keyframes cardGlow{0%{box-shadow:0 0 0 rgba(255,230,140,0)}30%{box-shadow:0 0 36px rgba(255,230,140,.55)}100%{box-shadow:0 0 18px rgba(255,230,140,.25)}}
@keyframes wordGlow{0%{text-shadow:0 0 0 rgba(255,245,190,0)}30%{text-shadow:0 0 16px rgba(255,245,190,.95)}100%{text-shadow:0 0 8px rgba(255,245,190,.45)}}
.finish{margin-top:16px;position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),var(--bg,#000) 30%);z-index:5}
.finrow{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.finrow{position:relative}
#trtext{position:absolute;left:0;right:0;bottom:calc(100% + 8px);z-index:6;max-height:46vh;overflow:auto;margin:0;background:#0d0d0f;border:1px solid var(--blue-m);box-shadow:0 -8px 28px rgba(0,0,0,.85);text-align:left}
.tja+.tja{margin-top:8px}.tja{line-height:1.5}
.tja .tng{color:var(--ng);font-weight:700}
.tja{font-size:16px;color:#fff}
.sum{font-size:14px;margin-bottom:6px}
.ev{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ev-l{font-size:22px;font-weight:700;letter-spacing:.02em}
.ev-l.g{color:#7dd3fc} .ev-l.b{color:#ff8fc7} .ev-l.s{color:#fde047}
.ev-s{font-size:12px;color:#d4d4d8}

/* stock */
.tabs{display:flex;gap:8px;margin-bottom:12px}
.lvl{font-size:15px;font-weight:800;color:var(--blue);margin:14px 0 6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.rank{width:26px;text-align:center;font-weight:800;color:var(--blue-m)}
.item .main{flex:1;min-width:0}
.item .en{font-size:17px;font-weight:700;cursor:pointer}
.item .meta{font-size:12px;color:var(--sub)}
.miss{background:#3b1220;color:var(--ng);border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap}
.del{border:0;background:var(--blue-l);color:var(--blue);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.empty{color:var(--sub);text-align:center;padding:24px 0;font-size:14px}
.hidden{display:none}
.hr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.nsel{display:flex;align-items:center;gap:3px}
.np.ta{width:34px;border-radius:999px;font-size:12px;letter-spacing:.3px;background:#ffd6ea;color:#c2185b;border-color:#ff8fc7}
.np.ta.on{background:#ff8fc7;color:#4a0a2a;border-color:#ff8fc7}
.nl{font-size:10px;color:var(--sub);margin-right:2px;white-space:nowrap}
h1{white-space:nowrap}
.logo-sign{display:inline-flex;flex-direction:column;gap:4px;background:#fff1dc;border:2px solid #ffc773;border-radius:14px;padding:6px 12px;margin:2px 0;white-space:nowrap}
.lg-row{display:inline-flex;align-items:center;gap:6px}
.lg-t{display:inline-flex;gap:2px}
.lg-t span{display:inline-flex;align-items:center;justify-content:center;width:1.55em;height:1.55em;font-size:14px;font-weight:900;color:#231815;line-height:1}
.lg-t.s span{font-size:11px;width:1.5em}
.lg-t .t1{background:#bbdcf4}.lg-t .t2{background:#f9c159}.lg-t .t3{background:#c4d710}.lg-t .t4{background:#f4abaf}
.lg-name{font-size:13px;font-weight:900;color:#1daacf;letter-spacing:.04em}
.hd{flex-direction:column;align-items:stretch;gap:4px}
.hd .hr{align-self:flex-end}
.pgname{font-size:11px;color:var(--sub);letter-spacing:.1em}

.np{width:24px;height:24px;border-radius:999px;border:1px solid var(--blue-m);background:var(--blue-l);color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;padding:0}
.np.on{background:var(--blue-d);color:#032a3d;border-color:var(--blue-d)}
.sentence+.sentence{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.qh{font-size:12px;color:var(--sub);margin-bottom:2px;font-weight:600}
#qcard{padding:12px 12px 8px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.qitem{padding:8px 0;border-bottom:1px solid var(--line)}
.qitem:last-of-type{border-bottom:0}
.qq{font-size:14px;line-height:1.45}
.qq b{display:inline-block;background:var(--blue-d);color:#032a3d;border-radius:7px;padding:0 6px;margin-right:6px;font-size:11px}
.qb{display:flex;gap:5px;align-items:center;width:100%;min-height:42px;text-align:left;border:2px solid var(--blue-m);background:var(--blue-l);color:var(--blue);border-radius:9px;padding:6px 8px;margin:0;font-size:13px;font-family:inherit;cursor:pointer;line-height:1.3}
.qb .qn{font-weight:800}
.qb.right{background:#0f3a22;border-color:var(--ok);color:var(--ok)}
.qb.wrong{background:#3b1220;border-color:var(--ng);color:var(--ng)}
.qres{font-size:16px;font-weight:700;text-align:center;padding:10px 0 2px;color:var(--blue)}
.ta-ok{font-size:13px;color:var(--sub);letter-spacing:.2em}.ta-star{font-size:30px;line-height:1.3}.ta-wpm{font-size:44px;font-weight:800;color:#fde047;line-height:1.1}.ta-wpm small{font-size:15px;color:#d4d4d8;margin-left:4px}
.ta-det{font-size:13px;color:#d4d4d8;font-weight:400;margin-top:4px}.ta-ng{font-size:30px;font-weight:800;color:var(--ng)}
.taov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.78);z-index:3;font-size:17px;font-weight:700;color:var(--blue);line-height:1.7;cursor:pointer;border-radius:16px}
#pcard.hide .sentence{visibility:hidden}
.note{font-size:12px;color:var(--sub);margin-top:6px}
</style>

const IDM={};
(function(){
  const grp=/\[([^\]]+)\]/g;
  const groups=t=>[...t.matchAll(grp)].map(m=>m[1].split("|"));
  IDIOM_DEFS.forEach(([en,kana,ja,lv])=>{
    const ge=groups(en), gk=groups(kana), gj=groups(ja);
    const total=ge.reduce((n,g)=>n*g.length,1);
    for(let c=0;c<total;c++){
      let r=c; const idx=ge.map(g=>{const i=r%g.length; r=Math.floor(r/g.length); return i;});
      const sub=(t,gs)=>{let j=0;return gs.length?t.replace(grp,()=>gs[j][idx[j++]]):t;};
      const e=sub(en,ge).toLowerCase();
      const k=sub(kana,gk.length?gk:[]), jj=sub(ja,gj.length?gj:[]);
      IDM[e]=[lv,k,jj];
      if(!D[e]) D[e]=[lv,k,jj];
    }
  });
})();

// 発音カタカナを英語の音に近づける（-er/-or→ァ、語末の-y→ィ など）
(function(){
  const KEEP=new Set(["her","for","are","our","door","more","four","or","car","star","hour","your","where","there","here","year","near","dear","other"]);
  const one=(e,k)=>{
    if(!k||KEEP.has(e)) return k;
    if(/(er|or|ar)$/.test(e)&&e.length>3&&k.endsWith("ー")) return k.endsWith("ァー")?k.slice(0,-1):k.slice(0,-1)+"ァ";
    if(/(er|or)s$/.test(e)&&k.endsWith("ーズ")) return k.slice(0,-2)+"ァズ";
    if(/[^aeiou]ies$/.test(e)&&k.endsWith("ーズ")) return k.endsWith("ィーズ")?k.slice(0,-2)+"ズ":k.slice(0,-2)+"ィズ";
    if(/[^aeiou]y$/.test(e)&&k.endsWith("ー")) return k.endsWith("ィー")?k.slice(0,-1):k.slice(0,-1)+"ィ";
    return k;
  };
  Object.keys(D).forEach(key=>{
    const e=key.split(" "), k=(D[key][1]||"").split(" ");
    if(e.length===k.length) D[key][1]=k.map((kk,i)=>one(e[i],kk)).join(" ");
    else { k[k.length-1]=one(e[e.length-1],k[k.length-1]); D[key][1]=k.join(" "); }
  });
})();
function mergeIdioms(tokens){
  const out=[];
  for(let i=0;i<tokens.length;){
    let done=false;
    if(!tokens[i].slash && !tokens[i].explicit){
      for(let n=4;n>=2&&!done;n--){
        const seg=tokens.slice(i,i+n);
        if(seg.length<n||seg.some(x=>x.slash||x.explicit)) continue;
        const key=seg.map(x=>x.key).join(" ");
        if(IDM[key]){ out.push({w:seg.map(x=>x.w).join(" "),key,idiom:true,explicit:true,ja:IDM[key][2]}); i+=n; done=true; }
      }
    }
    if(!done){out.push(tokens[i]);i++;}
  }
  return out;
}

const DISP={A:"D",B:"C",C:"B",D:"A",E:"S",F:"SS"};   // 表示上のレベル名
const LVNAME={A:"中1全体",B:"中2初級",C:"中2全体",D:"中3初級",E:"高校入試",F:"5文"};
const bandOf=n=>Math.min(5,Math.max(1,Math.floor((n-3)/3)+1));
function buildSent(raw,segstr,idx){
  const segs=segstr.split(";").map(x=>{const [t,u]=x.split(":");return {t,u:u.split(",").map(Number)};});
  const full=segs.map(g=>g.t).join("");
  const tokens=[];
  raw.split(/\s+/).forEach(t=>{
    if(t==="/"){tokens.push({slash:true});return;}
    const m=t.match(/^([^{]+)(?:\{([^}]*)\})?$/);
    const idiom=m[1].includes("_");
    const w=m[1].replace(/_/g," "), key=w.replace(/[.,!?"“”]/g,"").toLowerCase();
    if(!D[key]) console.warn("辞書にない語:",key);
    tokens.push({w,key,idiom,explicit:idiom||m[2]!==undefined,ja:m[2]!==undefined?m[2]:(D[key]||["","","?"])[2]});
  });
  tokens.splice(0,tokens.length,...mergeIdioms(tokens));
  const words=tokens.filter(t=>!t.slash);
  let lv="A"; words.forEach(t=>{const l=(D[t.key]||["A"])[0]; if(LV[l]>LV[lv]) lv=l;});
  const wc=words.reduce((n,t)=>n+t.w.split(" ").filter(w=>!/^(a|an|the)$/i.test(w.replace(/[^A-Za-z]/g,""))).length,0);   // a / an / the は語数に入れない
  const en=tokens.map(t=>t.slash?"/":t.w).join(" ");
  const band=bandOf(wc);
  return {id:idx,raw:en,en,full,segs,tokens,n:words.length,wc,lv,band,key:band+lv,label:DISP[lv]+band};
}
const SENTS = RAW.map(([raw,segstr],idx)=>buildSent(raw,segstr,idx));
const PASSAGES = (PDATA.passages||[]).map((p,pi)=>{
  const sents=p.sents.map((x,si)=>buildSent(x.raw,x.seg,1000+pi*10+si));
  const n=sents.reduce((a,s)=>a+s.n,0), wc=sents.reduce((a,s)=>a+s.wc,0);
  let lv="A"; sents.forEach(s=>{ if(LV[s.lv]>LV[lv]) lv=s.lv; });
  const band=bandOf(Math.round(wc/sents.length));
  return {id:"p"+pi,pid:p.id,title:p.title,sents,quiz:p.sents.map(x=>x.quiz),n,lv,band,key:band+lv,label:DISP[lv]+band,ns:sents.length};
});
// TA1/TA2/TA3：1文・2文・3文のタイムアタック用の問題をつくる（3文の文章から、つながった k 文を取り出す）
function makeTA(k,avoid){
  const cands=[];
  (PDATA.ta||[]).forEach((p,pi)=>{ for(let st=0;st+k<=p.sents.length;st++) cands.push({p,pi,st}); });
  let pool=cands.filter(c=>("t"+c.pi+"_"+c.st+"_"+k)!==avoid); if(!pool.length) pool=cands;
  const c=pool[Math.floor(Math.random()*pool.length)];
  const raws=c.p.sents.slice(c.st,c.st+k);
  const sents=raws.map((x,si)=>buildSent(x.raw,x.seg,2000+c.pi*10+c.st+si));
  const n=sents.reduce((a,s)=>a+s.n,0), wc=sents.reduce((a,s)=>a+s.wc,0);
  return {id:"t"+c.pi+"_"+c.st+"_"+k,pid:c.p.id,title:c.p.title,sents,quiz:raws.map(x=>x.quiz),n,wc,lv:"A",band:5,label:"TA"+k,ns:k,ta:true,k};
}
const TAS=(PDATA.ta||[]).map((p,pi)=>{
  const sents=p.sents.map((x,si)=>buildSent(x.raw,x.seg,2000+pi*10+si));
  const n=sents.reduce((a,s)=>a+s.n,0), wc=sents.reduce((a,s)=>a+s.wc,0);
  return {id:"t"+pi,pid:p.id,title:p.title,sents,quiz:p.sents.map(x=>x.quiz),n,wc,lv:"A",band:5,label:"TA",ns:sents.length,ta:true};
});
const wrap=s=>({sents:[s],n:s.n,lv:s.lv,band:s.band,label:s.label,id:s.id,single:true});

// iPhone対策：最初のタッチで読み上げを「解錠」し、cancel直後のspeakを避ける
let _unl=false;
function unlockSpeech(){
  if(_unl) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); _unl=true; }catch(e){}
}
let _sayId=0;
function say(text,lang,rate,voice){
  try{
    const id=++_sayId;
    const go=(retry)=>{
      if(id!==_sayId) return;   // あとから別の読み上げが来たら、古いほうはやめる
      const u=new SpeechSynthesisUtterance(text);
      u.lang=lang; u.rate=rate; u.pitch=1; u.volume=1;
      if(voice && !retry) u.voice=voice;   // 話し直すときは声の指定をはずす（古い声の情報が原因のことがある）
      let started=false; u.onstart=()=>{started=true;};
      u.onerror=()=>{ if(!started && !retry) setTimeout(()=>go(true),120); };
      try{speechSynthesis.resume();}catch(_){}
      speechSynthesis.speak(u);
      if(!retry) setTimeout(()=>{ if(!started && id===_sayId){ try{speechSynthesis.cancel();}catch(_){} setTimeout(()=>go(true),80); } },900);
    };
    if(speechSynthesis.speaking||speechSynthesis.pending){ speechSynthesis.cancel(); setTimeout(()=>go(false),80); }
    else go(false);
  }catch(e){}
}
function resetSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} _unl=false; _vc={}; }
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) resetSpeech(); });
window.addEventListener("pageshow",resetSpeech);
window.addEventListener("focus",()=>{ try{ if(speechSynthesis.paused) speechSynthesis.resume(); }catch(e){} });

let _vc={};
function pickVoice(lang){
  try{
    if(_vc[lang]) return _vc[lang];
    const vs=speechSynthesis.getVoices().filter(v=>(v.lang||"").replace("_","-").toLowerCase().startsWith(lang==="ja"?"ja":"en-us"));
    if(!vs.length) return null;
    let best=null;
    for(const re of VOICE_PREF[lang]){ best=vs.find(v=>re.test(v.name)); if(best) break; }
    best=best||vs.find(v=>!/compact/i.test(v.name))||vs[0];
    _vc[lang]=best; return best;
  }catch(e){return null;}
}

let AC=null;

  }catch(e){}

}

function unlockAudio(){

    const b=ac.createBuffer(1,1,22050), src=ac.createBufferSource(); src.buffer=b; src.connect(ac.destination); src.start(0);
  }catch(e){}
}

function chime(){

  try{
    const t0=ac.currentTime+0.02;
    // キラ・リン：短い2音のあと、高い音を長めに響かせる

let comboN=0;
// ドレミファソラシド→レミファソ…と、オクターブをまたいでどんどん上がる（高いドの2オクターブ上まで）
const MAJ=[0,2,4,5,7,9,11];
const noteFreq=n=>523.25*Math.pow(2,(Math.floor(n/7)*12+MAJ[n%7])/12);
function pip(freq,vol){
  if(!sel.sound) return;
  const ac=audio(); if(!ac) return;
  try{
    const t=ac.currentTime+0.01;
    [[freq,vol,"sine"],[freq*2,vol*.35,"triangle"]].forEach(([f,v,ty])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=ty; o.frequency.setValueAtTime(f,t);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.24);
    });
  }catch(e){}
}
function combo(v){
  if(v==="ok"){ pip(noteFreq(Math.min(comboN,14)),Math.max(.1,.16-comboN*.003)); comboN++; }
  else comboN=0;
}

/* ===== 効果音（指定SE：Web Audio、音源ファイルなし） ===== */
function playSE(events){
  var AC=window.AudioContext||window.webkitAudioContext;
  var c=window.__ac||(window.__ac=new AC());
  if(c.state==="suspended")c.resume();
  var t0=c.currentTime+0.02;
  var nb=window.__nb;
  if(!nb){nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;window.__nb=nb;}
  events.forEach(function(e){
    var g=c.createGain();g.connect(c.destination);
    if(e[0]==="t"){
      var f=e[1],s=e[2],du=e[3],w=e[4],v=e[5],to=e[6];
      var o=c.createOscillator();o.type=w;
      o.frequency.setValueAtTime(f,t0+s);
      if(to)o.frequency.exponentialRampToValueAtTime(to,t0+s+du);
      g.gain.setValueAtTime(0.0001,t0+s);
      g.gain.exponentialRampToValueAtTime(v,t0+s+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+s+du);
      o.connect(g);o.start(t0+s);o.stop(t0+s+du+0.02);
    }else{
      var s2=e[1],d2=e[2],v2=e[3],fc=e[4],ft=e[5];
      var src=c.createBufferSource();src.buffer=nb;
      var fl=c.createBiquadFilter();fl.type=ft;fl.frequency.value=fc;
      g.gain.setValueAtTime(0.0001,t0+s2);
      g.gain.exponentialRampToValueAtTime(v2,t0+s2+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+s2+d2);
      src.connect(fl);fl.connect(g);src.start(t0+s2,0,d2+0.02);
    }
  });
}

const CLEAR_N=5;

const itemsAt=(k,ns)=>{ const b=+k[0], l=k[1];
  if(l==="F") return PASSAGES.filter(p=>p.ns===5&&p.lv==="E"&&p.band===b);

function cellState(k){
  const m=(mem.cp||{})[k]||{st:0,c:0}; const last=lastSt(k);
  let st=m.st, c=m.c;
  while(st<=last && !itemsAt(k,stageNs(k,st)).length){ st++; c=0; }
  if(st>last){ const any=[0,1,2,3].slice(0,last+1).some(x=>itemsAt(k,stageNs(k,x)).length); return {done:true,nodata:!any,st:last,c:CLEAR_N,ns:stageNs(k,last),items:any?itemsAt(k,stageNs(k,last)):[]}; }
  const done= st===last && c>=CLEAR_N;

}

const earSVG=(k,st)=>{
  const ss=k[1]==="F", n=ss?1:4, base=46, top=21;
  const at=[[24,40,-1],[24,34,1],[24,28,-1],[24,23,1]];
  let g=`<svg class="ear" width="48" height="50" viewBox="0 0 48 50" aria-hidden="true"><g transform="rotate(14 24 ${base})"><path d="M24 ${base} L24 ${top}" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>`;
  for(let i=0;i<n;i++){
    const c= st.done||i<st.st ? CLEAR_N : (i===st.st ? st.c : 0);
    if(c<=0) continue;
    const big=(!ss&&i===3)?1.18:1, kk=0.4+0.6*c/CLEAR_N, rx=8*kk*big, ry=4.8*kk*big;   // ピンクは少し大きく

  }

};

// 文末（. ? !）のあとは // を表示する（次がスラッシュならそれを // にする）
function dispTokens(s){
  const out=[];
  s.tokens.forEach((t,ti)=>{
    if(t.slash){ const prev=out[out.length-1]; if(prev&&prev.dblDone) return; out.push({slash:true,ti}); return; }
    out.push(Object.assign({},t,{ti}));
    if(/[.?!]["”]?$/.test(t.w) && !/^(Mr|Ms|Mrs|Dr)\.$/.test(t.w)) out.push({slash:true,dbl:true,ti:"d"+ti,dblDone:true});
  });
  return out;
}

function attachSwipe(w,i,text){
  let sx=0,sy=0,on=false;
  w.addEventListener("pointerdown",e=>{audio();unlockSpeech();sx=e.clientX;sy=e.clientY;on=true;w.classList.add("drag");try{w.setPointerCapture(e.pointerId);}catch(_){}});
  w.addEventListener("pointermove",e=>{
    if(!on) return;
    const dy=e.clientY-sy, dx=e.clientX-sx;
    w.style.transform=`translateY(${Math.max(-26,Math.min(26,dy))}px)`;
    const sw=Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx);
    w.classList.toggle("hintok",sw&&dy>0); w.classList.toggle("hintng",sw&&dy<0);
  });
  const end=e=>{
    if(!on) return; on=false;
    const dy=e.clientY-sy, dx=e.clientX-sx;
    w.classList.remove("drag","hintok","hintng"); w.style.transform="";
    if(e.type==="pointercancel") return;
    if(Math.abs(dy)>28&&Math.abs(dy)>Math.abs(dx)) answer(i,dy>0?"ok":"ng");
    else if(Math.abs(dy)<10&&Math.abs(dx)<10) speak(text);
  };
  w.addEventListener("pointerup",end); w.addEventListener("pointercancel",end);
}

/* ===== 文ごとの評価（理解度×読む速さ。A〜E・文の長さで加重） ===== */
const LW={A:1,B:1.15,C:1.3,D:1.5,E:1.7};   // レベルの重み
function evalSentence(s,ans,ms){
  const n=s.n; let ok=0; for(let k=0;k<n;k++) if(ans[k]==="ok") ok++;
  const u=n?ok/n:0;
  const lw=LW[s.lv]||1, bw=1+0.1*(s.band-1), w=lw*bw;       // 加重＝レベル×長さ
  const exp=n*2.0*lw*(1+0.05*(s.band-1));                    // 目安の秒数（1語2秒を基準に、難しい・長い文ほど長く）
  const sec=ms/1000, r=sec/exp;
  const sp=Math.max(0,Math.min(1,(2-r)/1.4));                // 速さ点：目安の0.6倍以下で満点、2倍以上で0
  const score=Math.round(100*(0.7*u+0.3*sp));
  const label="",cls="";
  return {label,cls,score,ok,n,sec,exp,w,pts:Math.round(score*w)};
}
function refreshSlashes(){
  const it=queue[qi]; let wi=0;
  it.sents.forEach((s,si)=>{
    let start=wi; const chunks=[];
    dispTokens(s).forEach(t=>{ const ti=t.ti;
      if(t.slash){ chunks.push({end:wi,from:start,slashId:"sl"+si+"_"+ti}); start=wi; }
      else wi++;
    });
    chunks.forEach(ch=>{
      let all=true; for(let k=ch.from;k<ch.end;k++) if(!ans[k]) all=false;
      const el=document.getElementById(ch.slashId);
      if(all && !el.classList.contains("show")){ el.classList.add("show"); kiran(); }
      if(!all) el.classList.remove("show");
    });
  });
  const n=it.n; let done=0; for(let k=0;k<n;k++) if(ans[k]) done++;
  const fin=document.getElementById("fin");
  if(done===n){
    if(tEnd===null) tEnd=performance.now();
    clearInterval(taTimer);
    if(it.ta){ lastFin={ta:true}; const c=document.getElementById("taclock"); if(c) c.textContent="⏱ "+((tEnd-tStart)/1000).toFixed(1)+"秒"; finHTML(); return; }
    const E=evalSentence(it,ans,tEnd-tStart);
    const ng=Object.values(ans).filter(v=>v==="ng").length;
    if(!progDone){ progDone=true; setNg+=ng; if(setNg>2) setPerfect=false; }   // わからない単語はセット全体で2つまでOK
    lastFin={E,ng};
    const pc=document.getElementById("pcard");
    if(ng===0){ if(!pc.classList.contains("lit")){ pc.classList.add("lit"); celebrate(pc); } } else pc.classList.remove("lit");
    finHTML();
  } else { fin.classList.add("hidden"); const pc=document.getElementById("pcard"); if(pc) pc.classList.remove("lit"); }
}

/* ===== 誤答音：低めで軽い「プー」 ===== */
function buu(){
  if(!sel.sound) return;
  const ac=audio(); if(!ac) return;
  try{
    const t=ac.currentTime+0.01;
    [[170,.09,"sine"],[340,.025,"triangle"]].forEach(([f,v,ty])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=ty; o.frequency.setValueAtTime(f,t); o.frequency.linearRampToValueAtTime(f*.82,t+.32);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.03); g.gain.setValueAtTime(v,t+0.16); g.gain.exponentialRampToValueAtTime(0.0001,t+0.36);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.4);
    });
  }catch(e){}
}
/* ===== クイズ（2文以上：本文の場所に一覧で表示） ===== */
function startQuiz(){
  const it=queue[qi]; stage="quiz";
  const n=it.sents.length, nq=n<=3?1:2;   // 出題数：1〜3文=1問、4文以上=2問
  it._qok=false;
  let qsrc=it.quiz||[];
  if(it.single){   // 1文：英文の意味に合う日本語訳を選ぶ（ほかの選択肢は、長さの近いほかの文の訳）
    const s=it.sents[0];
    const near=SENTS.filter(x=>x.full!==s.full).sort((a,b)=>Math.abs(a.wc-s.wc)-Math.abs(b.wc-s.wc)).slice(0,15);
    const key=s.en.replace(/ \/ /g," ").replace(/"/g,"");
    qsrc=(PDATA.q1&&PDATA.q1[key])?[PDATA.q1[key]]:[{q:"英文の意味に合うものはどれですか。",correct:s.full,wrong:shuffle(near).slice(0,3).map(x=>x.full)}];
  }
  const pickIdx=shuffle(qsrc.map((q,i)=>q?i:-1).filter(i=>i>=0)).slice(0,nq).sort((a,b)=>a-b);
  let pos=[]; while(pos.length<nq) pos=pos.concat(shuffle([0,1,2,3]));   // 正解位置を①〜④に均等に振る
  qz=pickIdx.map(i=>qsrc[i]).map((q,i)=>{ const others=shuffle(q.wrong); let oi=0; const ch=[]; for(let k=0;k<4;k++) ch.push(k===pos[i]?q.correct:others[oi++]); return {q:q.q,ch,ans:pos[i],pick:null}; });
  const pc=document.getElementById("pcard")||document.getElementById("qcard");
  const qc=document.createElement("div"); qc.className="card"; qc.id="qcard";
  qc.innerHTML=`<div class="qh">${it.ta?"クイズ（全問正解で結果発表）":"クイズ（"+qz.length+"問）"}</div>`+qz.map((q,i)=>`<div class="qitem" data-i="${i}"><div class="qq"><b>${i+1}</b>${esc(q.q)}</div><div class="qgrid">${q.ch.map((c,k)=>`<button class="qb" data-i="${i}" data-c="${k}"><span class="qn">${CIRC[k]}</span><span>${esc(c)}</span></button>`).join("")}</div></div>`).join("")+`<div class="qres hidden" id="qres"></div>`;
  pc.replaceWith(qc);
  qc.querySelectorAll(".qb").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,c=+b.dataset.c,q=qz[i]; if(q.pick!==null) return;
    q.pick=c;
    qc.querySelectorAll('.qb[data-i="'+i+'"]').forEach(x=>{ const k=+x.dataset.c; if(k===q.ans) x.classList.add("right"); else if(k===c) x.classList.add("wrong"); });
    if(c===q.ans) chime(); else buu();
    if(qz.every(z=>z.pick!==null)){
      const r=qz.filter(z=>z.pick===z.ans).length, el=document.getElementById("qres");
      it._qok=(r===qz.length);
      if(it.ta) taResult(r,el); else el.textContent="正解 "+r+" / "+qz.length;
      el.classList.remove("hidden"); el.scrollIntoView({block:"nearest",behavior:"smooth"});
    }
  });
  finHTML();
  window.scrollTo({top:0,behavior:"smooth"});
}
const taStars=w=>w>=80?5:w>=65?4:w>=50?3:w>=35?2:1;
function taResult(r,el){
  const it=queue[qi]; stage="taend";
  if(r===qz.length){
    const sec=(tEnd-tStart)/1000, wpm=it.wc/(sec/60);
    const bk=taBestKey(it.k||3); const best=Math.max(mem[bk]||0,Math.round(wpm)); const isNew=best>(mem[bk]||0); mem[bk]=best; save();
    el.innerHTML=`<div class="ta-ok">結果発表</div><div class="ta-star">${starStr(taStars(wpm))}</div><div class="ta-wpm">${Math.round(wpm)}<small>語/分</small></div><div class="ta-det">${it.wc}語を ${sec.toFixed(1)}秒で読みました（クイズ ${r}/${qz.length}）<br>ベスト ${best}語/分${isNew?"　🎉自己ベスト更新！":""}</div>`;
    chime();
  } else {
    el.innerHTML=`<div class="ta-ng">失敗…</div><div class="ta-det">クイズが全問正解ではなかったので、結果は見られません（${r}/${qz.length}）</div>`;
  }
  finHTML();
}
function commit(){
  const it=queue[qi]; let wi=0, anyNg=false;
  it.sents.forEach(s=>{
    let sNg=false;
    s.tokens.forEach(t=>{
      if(t.slash) return;
      const v=ans[wi++];
      if(v==="ng"){
        anyNg=true; sNg=true;
        const w=mem.words[t.key]||(mem.words[t.key]={miss:0});
        w.miss++;
      }
    });
    if(sNg && it.single){ const e=mem.sents[s.id]||(mem.sents[s.id]={miss:0}); e.miss++; }
  });
  save();
  if(it.ta){ startQueue([makeTA(it.k||3,it.id)]); return; }
  if(!it._qok) setPerfect=false;   // クイズが全問正解でなければ、このセットはクリアにしない
  if(qi+1<queue.length){qi++;practice();}
  else {
    // 1セット（5問）を全部「全単語わかる」で終えたら、そのチェックボックスに小さな黄色い★
    // 1セットを全部ノーミスで終えたら、そのセットに入っていたマスを1つ進める
    if(setPerfect && !it.ta){ [...new Set(queue.map(x=>x.cell).filter(Boolean))].forEach(cellClear); }
    home();
  }
}

/* ===== ストック ===== */
function stock(){
  const wk=Object.keys(mem.words), sk=Object.keys(mem.sents);
  let body="";
  if(stockTab==="words"){
    if(!wk.length) body=`<div class="empty">まだありません</div>`;
    else ["A","B","C","D","E"].forEach(l=>{
      const list=wk.filter(k=>(D[k]||["A"])[0]===l)
        .sort((a,b)=>mem.words[b].miss-mem.words[a].miss || a.localeCompare(b));
      if(!list.length) return;
      body+=`<div class="lvl">レベル ${DISP[l]}（${list.length}語）</div>`+list.map((k,r)=>`
        <div class="item"><div class="rank">${r+1}</div>
          <div class="main"><div class="en" data-w="${k}">${disp(k)}</div><div class="meta">${D[k][1]}　${D[k][2]}</div></div>
          <span class="miss">${mem.words[k].miss}回</span>
          <button class="del" data-d="${k}">覚えた</button></div>`).join("");
    });
  } else {
    if(!sk.length) body=`<div class="empty">まだありません</div>`;
    else body=`<button class="btn small" id="pracStock" style="margin-bottom:6px">この${Math.min(SET,sk.length)}文を練習する</button>`+sk.map(Number).sort((a,b)=>mem.sents[b].miss-mem.sents[a].miss).map(id=>{
      const s=SENTS[id]; return `<div class="item"><span class="badge">${s.label}</span>
        <div class="main"><div class="en" data-s="${s.raw.replace(/"/g,"")}">${esc(s.raw)}</div></div>
        <span class="miss">${mem.sents[id].miss}回</span>
        <button class="del" data-ds="${id}">覚えた</button></div>`;}).join("");
  }
  app.innerHTML=`
    <div class="top"><button class="btn small sec" id="back">← トップ</button><h1 style="margin:0">ストック</h1><span></span></div>
    <div class="tabs">
      <button class="chip ${stockTab==="words"?"on":""}" data-t="words">単語（${wk.length}）</button>
      <button class="chip ${stockTab==="sents"?"on":""}" data-t="sents">文（${sk.length}）</button>
    </div>
    <div class="card">${body}</div>`;
  document.getElementById("back").onclick=home;
  const pr=document.getElementById("pracStock"); if(pr) pr.onclick=()=>{const ids=sk.map(Number); startQueue(shuffle(SENTS.filter(s=>ids.includes(s.id))).slice(0,SET).map(wrap));};
  app.querySelectorAll(".tabs .chip").forEach(b=>b.onclick=()=>{stockTab=b.dataset.t;stock();});
  app.querySelectorAll("[data-w]").forEach(e=>e.onclick=()=>speak(e.dataset.w));
  app.querySelectorAll("[data-s]").forEach(e=>e.onclick=()=>speak(e.dataset.s));
  app.querySelectorAll("[data-d]").forEach(e=>e.onclick=()=>{delete mem.words[e.dataset.d];save();stock();});
  app.querySelectorAll("[data-ds]").forEach(e=>e.onclick=()=>{delete mem.sents[e.dataset.ds];save();stock();});
}

home();

// 練習中：英文の枠の中では、どこをフリックしても画面全体がずれないようにする
document.addEventListener("touchmove",e=>{
  const pc=document.getElementById("pcard");
  if(pc && pc.contains(e.target)) e.preventDefault();
},{passive:false});
document.addEventListener("touchstart",e=>{
  const pc=document.getElementById("pcard");
  if(pc && pc.contains(e.target) && e.touches.length>1) e.preventDefault();
},{passive:false});
document.addEventListener("pointerdown",()=>{audio();unlockSpeech();},{passive:true});
</script>
</body>
</html>
